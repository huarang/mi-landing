<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Exclusivo - Contenido VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1a1128 0%, #0b0b0e 80%);
        }

        .landing-container {
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            text-align: center;
        }

        .card {
            background: rgba(20, 20, 30, 0.75);
            border: 1px solid rgba(255, 0, 128, 0.3);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 0, 128, 0.15);
            backdrop-filter: blur(10px);
        }

        .badge {
            background: linear-gradient(135deg, #ff007f, #ff7b00);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background-color: #22c55e;
            border: 3px solid #14141e;
            border-radius: 50%;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
        }

        h1 span {
            color: #ff007f;
        }

        p {
            color: #a0a0b2;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-cta {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff007f 0%, #d9006c 100%);
            color: #white;
            color: #fff;
            text-decoration: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            box-shadow: 0 8px 25px rgba(255, 0, 128, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 0, 128, 0.6);
            background: linear-gradient(135deg, #ff1a8c, #ff007f);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #6b6b80;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1.05); }
        }
    </style>
                                        
                                       
</head>
<body>

    <div class="landing-container">
        <div class="card">
            <div class="badge">🔥 Acceso Restricción +18</div>
            
            <div class="avatar-container">
                <!-- Puedes cambiar la URL de la imagen por la de tu preferencia -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Modelo" class="avatar">
                <div class="status-dot"></div>
            </div>

            <h1>Transmisión en Vivo <span>VIP</span></h1>
            
            <p>Estás a un solo paso de ver contenido exclusivo sin censura. Catálogo actualizado, alta definición y chat privado disponible.</p>

            <!-- Reemplaza el enlace de ejemplo "#" por tu link de promoción, Telegram o CPA -->
            <a href="#" class="btn-cta" target="_blank">Entrar Ahora Gratis</a>

            <div class="footer-text">
                🔒 Contenido exclusivo para mayores de edad. Acceso seguro y rápido.
            </div>
        </div>
    </div>

</body>
                                        
                                  
                                        
                                        
</html>
